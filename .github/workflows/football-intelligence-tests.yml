name: football-intelligence-tests

on:
  push:
    branches: ["football-intelligence-v1", "main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run football intelligence tests
        working-directory: projects/football_intelligence
        run: python -m pytest -q
